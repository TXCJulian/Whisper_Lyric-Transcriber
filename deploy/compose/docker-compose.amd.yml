# AMD ROCm GPU override — passes through render and KFD devices
# Usage: GPU_BACKEND=amd docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.amd.yml --env-file .env up -d --build
services:
  lyric-transcriber:
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
